<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body background="school.jpg">
    <h1>Odin school</h1>
    <form action="/submit" method="post">
        <table>
        <div>
        <tr>
        <td><label for="fname">First Name</label></td>
        <td><input type="text" id="fname" name="fname" required placeholder="Enter first name"></td>
        </tr>
        </div>
       
        <div>
        <tr>    
        <td><label for="mname">Middle Name</label></td>
        <td>
        <input type="text" id="mname" name="mname" required placeholder="Enter middle name"><br><br></td>
        </tr>
        </div>

        <div>
        <tr>
        <td><label for="lname">Last Name</label></td>
        <td><input type="text" id="lname" name="lname" required placeholder="Enter last name"><br><br></td>
        </tr>
        </div>

        <div>
            <tr>

        <td>
        <label for="password">Password</label></td>
        <td>
        <input type="password" id="password" name="password" required placeholder="Enter password"><br><br></td>
        </tr></div>

        <div>
            <tr>
        <td><label for="confirm_password">Confirm Password</label></td>
        <td><input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm password"><br><br></td>
        </tr>
       </div>

        <div>
        <tr>
        <td>
        <label for="email">Email</label></td>
        <td><input type="email" id="email" name="email" required placeholder="Enter email"><br><br></td>
        </tr>
        </div>

        <div>
        <tr>
        <td>
        <label for="phone">Phone Number</label>
        </td>
        <td>
        <input type="tel" id="phone" name="phone" required placeholder="Enter phone number"><br><br>
        </td>
        </tr>
        </div>

        <div>
        <tr>
        <td>
        <label for="dob">Date of Birth</label>
        </td>
        <td>
        <input type="date" id="dob" name="dob" required><br><br>
        </td>
        </tr>
        </div>

        <div>
        <tr>
        <td>  
        <label for="gender">Gender</label></td>
        <td>
        <select name="gender" id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br></td>
        </tr>
        </div>

        	<div class="submit-button form-row">
                <tr>
					<td><button type="submit">Submit</button></td>
                </tr>
			</div>
    </form>
</body>
</html>
<style>
    body{
        background-color: #f0f0f0;
        background-image: url('school.jpg');
        background-size: cover;
        background-position: center;
    }
    input{
        padding: 10px;
        margin: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    select{
        padding: 10px;
        margin: 5px;
        border: 1px solid #ccc;
        border-radius: 10px;
    }
    label{
        font-weight: bold;
        margin-right: 10px;
        color: white;
    }
    h1{
        text-align: center;
        color: white;
    }
</style>
